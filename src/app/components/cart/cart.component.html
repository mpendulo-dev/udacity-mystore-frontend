<div class="cart row mt-5 p-4">
  <div class="col-sm-6">
    <div *ngIf="cart$ | async as cart" class="mt-3">
      <div *ngFor="let item of cart.items" class="cart-item">
        <img [src]="item.url" class="cart-image" />

        <div class="cart-details">
          <h6>{{ item.name }}</h6>

          <div class="d-flex align-items-center gap-2">
            <label>Amount:</label>

            <select
              class="form-select quantity-select"
              [(ngModel)]="item.quantity"
              (ngModelChange)="updateQuantity(item.id, $event)"
            >
              <option *ngFor="let qty of quantityOptions" [value]="qty">
                {{ qty }}
              </option>
            </select>
          </div>
          <div class="fw-bold">
            {{ item.price | currency }}
          </div>
          <button
            class="btn btn-sm btn-outline-danger mt-2 mb-3"
            (click)="removeItem(item.id)"
          >
            Remove
          </button>
        </div>
      </div>

      <hr />

      <h4>Total: {{ getTotal(this.cartItems) | currency }}</h4>
      <button class="btn btn-danger mt-3" (click)="clearCart()">
        Clear Cart
      </button>
    </div>
  </div>
  <div class="col-sm-6">
    <form #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>

        <input
          type="text"
          class="form-control"
          id="fullName"
          name="fullName"
          [(ngModel)]="fullName"
          #fullNameInput="ngModel"
          required
          minlength="3"
          placeholder="(minimum 3 characters)"
        />

        <small
          class="text-danger"
          *ngIf="fullNameInput.invalid && fullNameInput.touched"
        >
          Full name must be at least 3 characters
        </small>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>

        <input
          type="text"
          class="form-control"
          id="address"
          name="address"
          [(ngModel)]="address"
          #addressInput="ngModel"
          required
          minlength="6"
          placeholder="(minimum 6 characters)"
        />

        <small
          class="text-danger"
          *ngIf="addressInput.invalid && addressInput.touched"
        >
          Address must be at least 6 characters
        </small>
      </div>

      <div class="mb-3">
        <label for="creditCard" class="form-label"> Credit Card Number </label>

        <input
          type="number"
          class="form-control"
          id="creditCard"
          name="creditCard"
          [(ngModel)]="creditCard"
          #creditCardInput="ngModel"
          required
          min="1000000000000000"
          max="9999999999999999"
          placeholder="(16-digit number)"
        />

        <div id="creditCardHelp" class="form-text text-muted">
          We'll never share your payment details with anyone else.
        </div>

        <small
          class="text-danger"
          *ngIf="creditCardInput.invalid && creditCardInput.touched"
        >
          Credit card must be 16 digits
        </small>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Submit
      </button>
    </form>
  </div>
</div>
