<div class="checkout-container">
  <div class="checkout-card text-center">
    <h2 class="text-success mb-3">Success!</h2>

    <p class="mb-2">
      Thank you, <strong>{{ fullName }}</strong>
    </p>

    <p class="mb-2">Your total order is confirmed!</p>

    <p class="text-muted mb-4">Please allow 1–3 business day(s) for shipping</p>

    <h4 class="mb-4">Total: {{ total | currency }}</h4>

    <button class="btn btn-outline-primary" (click)="goBack()">
      Back to Products
    </button>
  </div>
</div>
