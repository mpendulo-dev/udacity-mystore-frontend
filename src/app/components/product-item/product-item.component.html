<div class="container mt-5" *ngIf="product">
  <div class="row">
    <div class="col-md-6">
      <img [src]="product.url" class="img-fluid rounded shadow" />
    </div>

    <div class="col-md-6">
      <h2>{{ product.name }}</h2>

      <h3 class="text-primary">R{{ product.price }}</h3>

      <p class="mt-3">
        {{ product.description }}
      </p>

      <button class="btn btn-primary mt-3 w-100">Add to Cart</button>

      <button class="btn btn-outline-secondary mt-2 w-100" routerLink="/">
        Back to Products
      </button>
    </div>
  </div>
</div>
