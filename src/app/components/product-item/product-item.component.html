<div class="container mt-5" *ngIf="product">
  <div class="row">
    <div class="col-md-6">
      <img [src]="product.url" class="img-fluid rounded shadow product-image" />
    </div>

    <div class="col-md-6">
      <h2>{{ product.name }}</h2>

      <h3 class="text-primary">R{{ product.price }}</h3>

      <p class="mt-3">
        {{ product.description }}
      </p>
      <div class="d-flex align-items-center gap-2 mb-3">
        <label>Amount:</label>

        <select
          class="form-select quantity-select"
          (change)="updateQuantity(product.id, $event)"
        >
          <option *ngFor="let qty of quantityOptions" [value]="qty">
            {{ qty }}
          </option>
        </select>
      </div>
      <button
        class="btn btn-primary mt-3 w-100"
        (click)="addItemToCart(product)"
      >
        Add to Cart
      </button>

      <button class="btn btn-outline-secondary mt-2 w-100" routerLink="/">
        Back to Products
      </button>
    </div>
  </div>
</div>
