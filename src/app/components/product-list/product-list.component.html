<div class="container mt-5">
  <div class="row">
    <div class="col-md-4" *ngFor="let product of products">
      <app-product-card
        [product]="product"
        (addToCart)="addItemToCart($event)"
        (quantityChange)="updateQuantity($event)"
      ></app-product-card>
    </div>
  </div>
</div>
